{% extends 'ideas/base.html' %}

{% block title %}Confirmar Exclusão{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-0 shadow-sm fade-in">
            <div class="card-header bg-white border-0 pt-4 text-center">
                <i class="bi bi-exclamation-triangle-fill text-warning display-1 mb-3 d-block"></i>
                <h3 class="card-title fw-bold">Confirmar Exclusão</h3>
            </div>
            
            <div class="card-body text-center">
                <p class="mb-3">Tem certeza que deseja excluir a ideia:</p>
                <div class="alert alert-warning">
                    <i class="bi bi-quote me-2"></i>
                    <strong>{{ idea.title }}</strong>
                </div>
                <p class="text-muted small mb-4">Esta ação não pode ser desfeita.</p>
                
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2 justify-content-center">
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-check-lg me-1"></i>
                            Sim, excluir
                        </button>
                        <a href="{% url 'idea_list' %}" class="btn btn-outline-secondary">
                            <i class="bi bi-x-lg me-1"></i>
                            Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
